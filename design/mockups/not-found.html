<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden — BusinessHandler</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="app-nav" data-od-id="main-nav">
    <div class="wordmark" data-od-id="wordmark">BusinessHandler</div>
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="index.html" class="nav-item" data-od-id="nav-dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="customers.html" class="nav-item" data-od-id="nav-customers">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Kunden</span>
      </a>
      <a href="orders.html" class="nav-item" data-od-id="nav-orders">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Aufträge</span>
      </a>
    </nav>
    <div class="sidebar-foot">MVP v1.0 · ohne Backend</div>
  </aside>

  <main class="main" data-od-id="main">
    <div class="page">
      <div class="notfound" data-od-id="not-found">
        <div class="notfound-code">404</div>
        <h1 data-od-id="not-found-title">Auftrag #1042 wurde nicht gefunden.</h1>
        <p>Der angeforderte Datensatz existiert nicht oder wurde gelöscht.</p>
        <a class="btn btn-primary" href="index.html" data-od-id="btn-to-dashboard">Zum Dashboard</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var nav = document.querySelector('.nav');
      var navItems = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
      navItems.forEach(function (el, i) { el.tabIndex = i === 0 ? 0 : -1; });
      nav.addEventListener('keydown', function (e) {
        var idx = navItems.indexOf(document.activeElement);
        if (idx === -1) return;
        var next = null;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = navItems[(idx + 1) % navItems.length];
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = navItems[(idx - 1 + navItems.length) % navItems.length];
        else return;
        e.preventDefault();
        navItems.forEach(function (el) { el.tabIndex = -1; });
        next.tabIndex = 0; next.focus();
      });
    })();
  </script>
</body>
</html>
